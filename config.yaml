# AV1 Transcode Archive - configuration
# All values can be overridden via environment variables AV1TC_<SECTION>_<KEY>
# e.g. AV1TC_TRANSCODE_VIDEO_CRF=26

dirs:
  input: /media/input        # watch folder (mounted volume)
  # null (default) => transcode into an `av1/` subdir next to each source
  # file; RPU extracts go into `<source_dir>/av1/rpu/`. Set to a fixed path
  # (e.g. /media/output) to collect everything in one place instead.
  output: null
  rpu: null                  # null => <source_dir>/av1/rpu (or dirs.output/rpu)
  work: /media/work          # temp/working files (av1an chunks)
  archive: null               # archive functionality removed - keep source files in place
  db: /data/av1transcode.db  # SQLite job database
  logs: /data/logs
  presets_file: /data/presets.json   # user presets saved from the web UI
  settings_file: /data/settings.json # user settings (parallelism) from web UI

workers:
  concurrency: 1             # parallel transcode jobs (each uses av1an multi-worker)
  av1an_workers: 0           # av1an internal chunk workers (0 = auto)
  max_retries: 2

watcher:
  enabled: false           # 默认关闭自动入队；仅转码用户手动提交的文件/目录
  recursive: true
  stable_seconds: 30         # file must be unchanged this long before processing
  min_size_mb: 20
  extensions: [mkv, mp4, mov, m2ts, ts, avi]

transcode:
  # default preset (see presets below)
  default_preset: balanced
  skip_existing_av1: true
  min_height_to_transcode: 0   # 0 = never re-encode AV1
  keep_temp: false
  delete_source: false         # set true to delete source after success

  presets:
    quality:                   # highest fidelity, slowest
      crf: 22
      preset: 2
      film_grain: 0
      passes: 1
      pixel_format: yuv420p10le
    balanced:                  # default: good quality/speed balance
      crf: 28
      preset: 4
      film_grain: 0
      passes: 1
      pixel_format: yuv420p10le
    compact:                   # smaller files, faster
      crf: 34
      preset: 6
      film_grain: 0
      passes: 1
      pixel_format: yuv420p10le

  video:                       # defaults used when preset selected
    codec: svt-av1
    crf: 28
    preset: 4
    film_grain: 0              # 0=off, 8-10 good for grainy film
    film_grain_denoise: false
    luminance_qp_bias: 0        # SVT --luminance-qp-bias，按帧平均亮度降 QP(0 = 关，1-100)，
                               # 也就是给暗帧更多比特。逐预设开关,不设全局默认值。
                               # 两段 90s 4K 实测(值 50,同配置对照)：体积 +9.8%(暗场)
                               # 和 +8.9%(亮场)，交付 VMAF 中位 +0.37 / +0.06，任何
                               # 探测 CRF 都够不到目标的镜头 6/23 → 2/23。所以它确实
                               # 打到了目标镜头,但**不只作用于暗帧**(亮场也涨),而且
                               # CRF 搜索不会把多给的比特换成更高的 CRF——值不值是对
                               # 片库的取舍判断,不是技术默认值。
    passes: 1
    keyint: 240
    tune: 0                    # 0=VQ, 1=PSNR, 2=SSIM
    extra_split_sec: 60
    min_scene_len: 24
    pixel_format: yuv420p10le
    additional_video_params: ""

  dovi:
    enabled: true
    save_rpu: true             # extract & archive RPU (.rpu)
    p5_method: libplacebo      # 唯一选项：ffmpeg 里只有 libplacebo 能真正“应用”DV RPU。
                               # 旧值 zscale 会被忽略并告警（那条链是空转换，且未编译进 ffmpeg）
    vulkan_device: ""          # libplacebo 用的 Vulkan 设备（-init_hw_device 选择器）。
                               # 空=自动：有 GPU 用 GPU，没有退回 llvmpipe 软件渲染
    p5_cache_dir: /dev/shm     # optimizer 引擎逐镜头转换的分片存放处(tmpfs=不落盘)。
                               # 放不下的镜头自动退回 dirs.work
    # 这里没有 strip_rpu 开关。P7/P8 源在送进编码器前一律剥掉 DV 层，
    # RPU 由 save_rpu 单独另存。曾经有个 strip_rpu 字段写在这里、也写在
    # 文档里，但代码从来没读过它；选择删掉而不是接上，因为接上会改变
    # 那些已经设了 strip_rpu: false 并（正确地）观察到毫无影响的人的行为。
    # 旧配置里留着这一行也没关系，未知键会被忽略。

  # Netflix-style shot-based encoding engine (select per preset via
  # VideoParams.engine = "optimizer"). Uses PySceneDetect for shot detection,
  # probes every shot in PARALLEL at a grid of CRFs, interpolates a fine-grained
  # per-shot CRF to hit target_quality, then encodes all shots in parallel.
  optimizer:
    probe_crfs: [20, 26, 32, 38, 44]  # CRF grid probed per shot
    probe_bracket_width: 6       # 二分到区间窄于此就停(CRF)。6 并不算粗:
                                 # 实测 4K 原生下 VMAF-CRF 曲线斜率只有 0.14~0.36,
                                 # 即 1 分 VMAF = 3~7 个 CRF, 而探测窗口本身的取样差异
                                 # 就能到 2.5 分。再二分得细也是在追一个测量给不出的精度。注意它和上面 probe_crfs 的
                                 # 间距会互相抵消: 间距 6 => 种子给出宽 12 的区间, 二分一次
                                 # 到 6 就退出, 所以自适应比固定网格只省约一次探测
                                 # (实测 3.3 次/镜头 对 网格的 5)。想让它真正起作用,
                                 # 要么调窄这个值, 要么把 probe_crfs 铺得更疏。
    min_shot_frames: 0           # 短于此的镜头并入相邻镜头 (0=不合并)
    verify_shots: 10             # 编码后抽验多少个镜头的实际交付质量 (0=不验)。
                                 # 这是全流程唯一的对账机制: 它把"探测预测"和"实际交付"
                                 # 的偏差报出来, 偏差大通常意味着窗口没对齐而不是编码器问题
    probe_preset: 10             # fast SVT-AV1 preset for probe encodes (4K 下 SVT 自动降到 9)
    probe_scale: ""              # 空=按源分辨率探测。填了就等于用另一个分辨率的 RD 曲线
                                 # 去挑 CRF，4K 实测会把 CRF 20..44 压成 5 个 VMAF 点
    probing_rate: 1              # probe every nth frame of each shot (>1 会低估质量)
    probe_cpu_charge: 1.0        # 一次探测按 lp 的几成计入 CPU 预算。1.0=按满 lp 记账
                                 # (现状)。但探测任务并非全程在编码——它还要读源解码、
                                 # 再打分，只有编码那一段真的用满 lp 个核。4K 实测: 每次
                                 # 探测平均只用 1.79 核却占着 4 个令牌，整个阶段 CPU
                                 # 利用率 45%，并发被死死钉在 cores/lp。
                                 # 调低确实能放更多探测: 实测 0.5 让探测并发从 10 涨到 18。
                                 # 但它没有变快——同片段、同 158 次探测、选出的 CRF 逐个相同,
                                 # 313.1s(1.0) 对 342.4s(0.5), 并发多 80% 吞吐反而少 9%。
                                 # 那些"看起来空转"的核并不空: 一个探测在解码/打分时另一个
                                 # 正在编码, 各阶段本来就跨任务错开了, 单看一个任务像超额
                                 # 预留, 合起来其实差不多。多放只是多抢。
                                 # 保留它是因为在别的机器形状上(核多内存少, 或度量更便宜)
                                 # 它是对的杠杆; 但别指望在这里白捡吞吐。默认 1.0 = 现状。
    probe_max_frames: 120        # 每镜头探测帧数上限；超长镜头取中间一段连续帧，不做抽帧。
                                 # 这不是保守默认值，是承重的。实测降到 64: 探测阶段确实
                                 # 快 1.55x、整体快 1.30x，但窗口变短会系统性高估质量——
                                 # 选出的 CRF 平均偏高 +2.2(最大 +12.2, 有镜头直接顶到上限),
                                 # 而"预测 vs 交付"的偏差从 -0.38 恶化到 -2.28，
                                 # 即探测的预测力掉了 6 倍。想动它就得连着看 verify_shots
                                 # 报出来的那个偏差，只看快了多少会亏掉画质。
                                 # 往上调是降低预测误差的主要手段。10 个 4K 窗口的残差分解:
                                 # 探测 preset 贡献 -0.80 的偏差(sd 0.76)，把 300 帧镜头截成中间
                                 # 120 帧贡献 sd 1.22——几乎是纯噪声，因为中间那段能不能代表整个
                                 # 镜头是镜头自己的性质。两项合起来 sd 1.16，对端到端实测的 1.19，
                                 # 说明插值几乎不贡献误差。
                                 # 截断的影响比镜头"个数"看起来大得多: 两集真实 4K 里只有 13-22%
                                 # 的镜头超过 120 帧，但它们占了 47-55% 的画面，而探测只看到其中
                                 # 约 45%。而往上调的代价不大，因为长镜头本来就少——1035 个镜头的
                                 # 一集实测,探测总帧数在 240 是 1.16x、480 是 1.26x、完全不限是
                                 # 1.35x，被截断的画面比例则从 26.2% 依次降到 14.1%、7.1%、0%。
                                 # 并发不会因此下降: _est_probe_gb 只随 log(帧数)增长(120→480 仅
                                 # +29%)，而池宽早就被 核数/lp 卡住，离内存预算还远。
    vmaf_model: /usr/share/model/vmaf_v0.6.1.json
    vmaf_model_4k: /usr/share/model/vmaf_4k_v0.6.1.json  # 源宽 >= vmaf_4k_min_width 时改用它，
                                 # 并且按原生分辨率测(不再缩到 vmaf_width)。0.6.1 是 1080p/3H 训练的，
                                 # 4k 模型是 4K/1.5H；实测缩到 1080p 测会偏乐观(CRF32 +0.80, CRF38 +1.63)
    vmaf_4k_min_width: 2560      # 低于这个宽度仍用 1080p 模型 + 降采样
                                 # 另可选 /usr/share/model/vmaf_v0.6.1neg.json：
                                 # neg 版不给"锐化/对比增强"送分，对判断"糊不糊"更诚实
    # target_metric 可选 vmaf(默认) / ssimulacra2 / xpsnr：
    #   vmaf        按分辨率自动选模型(见上)。注意上游至今没有 HDR 模型
    #   ssimulacra2 经 VapourSynth + vszip 计算，对模糊/色带最敏感。实测 4K 上
    #               CRF26→38 跨度 15.0 分，而 VMAF 只有 2.9 分(分辨力约 5 倍)，
    #               但慢约 9 倍，所以按 ssimulacra2_frame_step 抽帧打分。
    #               量纲不同：90+≈视觉无损、70-80≈高质量，目标值需重新定标
    #   xpsnr       ffmpeg 内置，ITU 标准化，为 UHD/HDR 设计且很快。单位 dB，
    #               社区经验 42dB 以上≈视觉无损(内容相关)，目标值同样要重定标
    ssimulacra2_frame_step: 4    # 打分侧每 n 帧取 1(逐帧度量，抽帧统计上成立；
                                 # 注意这和 probing_rate 不同——那个会歪曲 RD 曲线)
    ssimulacra2_model: version=ssimulacra2   # 保留兼容，当前不再经 libvmaf
    vszip_plugin: /usr/local/lib/vapoursynth/libvszip.so
    bestsource_plugin: /usr/local/lib/vapoursynth/libbestsource.so
    vmaf_width: 1920             # 送进 libvmaf 前把两路都缩到这个宽度(只缩不放，保持比例)。
                                 # vmaf_v0.6.1 是 1080p 训练的，直接测 4K 超出模型适用范围
    vmaf_threads: 0              # 0 = auto(核数/probe_workers)。libvmaf 自己的默认是单线程，
                                 # 在 4K 上比它要测的探测编码还慢(7.0s vs 8 线程 2.1s，分数一样)
    vmaf_sycl_device: -1         # 用 libvmaf 的 SYCL 后端在 GPU 上打分。-1=关闭(走 CPU)；
                                 # >=0 是 SYCL 设备号，会作为 sycl_device=N 传给 libvmaf filter。
                                 # 需要镜像里是 VMAFx 版 libvmaf + 一块 Level Zero 设备(Intel Arc)。
                                 # B580 实测(120 帧原生 4K，即真实探测规模)：1.7s / 1 核 / 0.25GB，
                                 # 对比 CPU 的 5.6s / 10.7 核 / 7.6GB；分数不变(15 个对照点差 <=0.0001，
                                 # 过 pick_crf 后选出的 CRF 偏差 <=0.0006)。
                                 # 设备不可用时 filter 会直接报错而不是偷偷回退 CPU，
                                 # 所以每个任务开头会先做一次预检，不行就整个任务退回 CPU。
    vmaf_sycl_min_width: 1920    # 源宽度低于此值即使开了也走 CPU。B580 上 1080p 实测(蓝光 8-bit
                                 # H.264 片段 88 镜头，qsv+svt，40 核，各跑两次)：探测阶段 CPU 199s，
                                 # SYCL 常规读取 124s，零拷贝 99s；每镜头 CPU 84.5 → 44.6 → 24.2 秒，
                                 # 分数与 CPU 相差 <=1.1e-3。1920 以下没测过。
    probe_workers: 0             # 并行探测实例数 (0=自动，按本 cgroup 可用内存算，
                                 # 不是整机内存；4K 探测实例实测峰值 3.5GB)
    encode_workers: 0            # 并行正式编码实例数的硬上限 (0=推荐，不设上限)。
                                 # 编码阶段按「内存+CPU 预算」逐个镜头准入，并发度随镜头
                                 # 成本浮动：4K 实测 24 帧镜头 3.4GB、1150 帧镜头 10.5GB，
                                 # 任何固定值对长镜头都偏多(会被 OOM kill)、对短镜头都偏少
    encode_threads: 0            # 每实例 taskset 绑定的核数 (0=推荐，不绑定)。
                                 # 并发度会浮动，按固定实例数切核会在并发低时白扔核心
                                 # (实测慢 5%)；总并行度已由准入预算约束
    scenedetect_threshold: 27.0  # PySceneDetect ContentDetector sensitivity
    min_scene_len: 24            # minimum shot length in frames
    scenedetect_engine: scdet    # 用哪个检测器找镜头边界:
                                 #   scdet         ffmpeg 的场景变化滤镜，对源跑一趟就完事。
                                 #                 不落盘，也不需要 PySceneDetect / OpenCV。
                                 #                 三个 4K 源实测(阈值 2.0): 一个边界完全一致、
                                 #                 另两个各多 1 个。整个阶段 44.7s/255s CPU
                                 #                 → 12.2s/8s CPU
                                 #   pyscenedetect 旧路径: 先写降采样副本，再用 OpenCV 逐帧读
    scdet_threshold: 2.0         # scdet 判定切点的分数门限(0-100)。注意 ffmpeg 自己的默认值 10
                                 # 对影视素材太高——4K 样本上 21 个切点只找到 1 个。
                                 # 2.0 和旧检测器几乎一致；0.8-1.5 会多抓一些较软的转场
                                 # (单帧幅度 1.5-4.5)；低于 0.5 抓到的多是宽 4-5 帧、幅度 0.5
                                 # 的镜头运动/光线变化，而且会把本来正确的边界推偏
    scenedetect_hwaccel: auto    # 分镜降采样是否用 GPU 解码(auto/off)。auto 先试 Intel QSV，
                                 # 没有可用设备、卡不支持该编码(B580 解 AV1 会返回 0 但不写输出)、
                                 # 或 scenedetect_scale 不是纯 W:H 时自动退回软件。
                                 # 解码和缩放上 GPU，副本仍用 x264 编码。注意这并不能逐比特复现
                                 # 软件副本——GPU 缩放器不是 swscale，边界切点可能落在不同位置。
                                 # 保真的做法(回传 4K 帧再用 swscale)比软件还慢一倍，不可行。
                                 # 三个 90 秒 4K 片段实测: 2160p 46.4s→17.2s / 29.5s→20.1s，
                                 # 镜头列表两个完全一致、一个 33→34(约 3%，和 540p 降采样本身
                                 # 带来的 2/59 差异同量级)。1606p 反而变慢(x264 成为瓶颈)
    reference_hwaccel: "off"     # 探测打分的参考侧、验证的源侧是否用 GPU(VA-API)解码(auto/off)。
                                 # 默认 off 是实测出来的。同一段 150s 4K、40 核、分数三次完全一致:
                                 #   不用硬件读参考  探测 401.3s  总计 439.7s
                                 #   VA-API 读参考   探测 447.7s  总计 491.9s
                                 #   VA-API + 上限6  探测 482.5s  总计 528.2s
                                 # 它省 CPU(240 帧打分 28.5 对 33.0 CPU 秒)但费墙钟(16.8s 对 6.9s):
                                 # 4K 帧从显存回传比直接解码还慢。只有 CPU 是瓶颈时才划算——20 核
                                 # 上同一段素材开了它是 826s→592s。40 核上是净亏，而且让每次打分
                                 # 占用的 DRM client 从 1 个变成 2 个，显存翻倍,这正是 12GB 的 B580
                                 # 被撑爆、只能重启才恢复的原因。CPU 吃紧的机器才开。
                                 # auto 在作业开始各解 8 帧(带 -ss 定位)做软解/硬解逐帧 md5 对比，
                                 # 不一致则整个作业软解。用 VA-API 而不是 QSV 不是偏好：QSV 是
                                 # 独立解码器、自己处理时间戳，-ss 之后在带时间轴空洞的 mkv、
                                 # DV P5 mp4、8-bit H.264 WEB-DL 上保留的帧和软解不同(像素逐比特
                                 # 一致、帧全错，打出 55 分而软解 92)；VA-API 只是给 ffmpeg 自带
                                 # 解码器加速，选帧和软解路径一样，九种情况九次分数完全一致。
                                 # 只放这一路上 GPU：4K 帧从显存回传约 130 帧/s 封顶
                                 # (10 路并发实测)，探测池本来就吃到这个量，再把编码那一路也放
                                 # 上去反而会被 GPU 卡住；AV1 探测文件用 dav1d 比 QSV+回传更快
                                 # (120 帧 10.1s 对 13.5s)。实测 120 帧 4K SYCL 打分 39.4→22.1
                                 # CPU 秒、墙钟 -12%，解码帧逐比特一致，分数不变。
    vmaf_zero_copy: "off"        # 探测打分时两路(源窗口 + 探测 ivf)都在 VA-API 上解码，帧以显存形式
                                 # 直接交给 libvmaf_sycl，不回传内存(auto/off)。B580 实测 4K 探测窗口:
                                 # 常规 5.4s / 23 CPU 秒 / 661MB，零拷贝 1.18s / 1.36 CPU 秒 / 1.55GB，
                                 # 247 次打分逐帧分数完全一致；3 个并发 7.2s/87 CPU 秒 对 2.6s/7.5 CPU 秒，
                                 # 显存成为并发上限。需要 vmaf_sycl_device、4K 模型(不缩放)、不设
                                 # probing_vmaf_features(只导入亮度)、源位深与探测编码一致；每个作业先用
                                 # 一个窗口两种方式各打一次分，差 >1e-3 则整个作业走常规读取；单个窗口
                                 # 失败退回常规打分，连续失败则本作业关闭。镜像需带 libva 编译的 libvmaf
                                 # 和 keep-decoder-until-cleanup 的 ffmpeg 补丁，否则 iHD 驱动约 9% 的
                                 # 打分会段错误并重置计算引擎。
    vmaf_sycl_workers: 0         # 同时最多几个探测在 GPU 上打分(0 = 自动，6)。这不是探测池宽度：
                                 # 显卡只有一块显存，每个 GPU 打分占一个 SYCL 上下文，开了
                                 # reference_hwaccel 还要一个 VA-API 解码会话(4K surface 池)。
                                 # 各 10 个就把 12GB 的 B580 撑爆了(OUT_OF_DEVICE_MEMORY →
                                 # DEVICE_LOST → 整个作业失败)，而且之后显卡一直是坏的，
                                 # 后续进程 2 个并发也失败。加宽队列本来也没好处：240 帧 4K
                                 # 窗口实测吞吐 n=4 就到顶(0.21/s，n=10 才 0.23/s)，n=12 全灭。
    gpu_vram_budget_mb: 0        # 本作业最多占用显卡多少显存(MB，0 = 自动，6000)。
                                 # vmaf_sycl_workers 数的是"操作个数"，这里数的是字节 ——
                                 # 显卡真正会耗尽的是后者。两者同时生效：worker 数仍是并发
                                 # 上限，显存预算决定准入。默认值刚好落在现在这个 worker 上限
                                 # 的位置(6 个 4K 打分 + reference_hwaccel 实测 5.27GB)。
                                 # 它比数个数多出来的能力，是看得见"每个操作有多大"：探测窗口
                                 # 加长、QSV 探测编码和打分同时压在卡上、或者估算本身不准，
                                 # 这些都改变每个操作的字节数而不改变个数。
                                 # 占用量用 DRM fdinfo 实测(nvtop 读的那个接口)，所以是显卡
                                 # 真实持有量而不是预测值 —— 但只能看见本 PID 命名空间。Plex
                                 # 也在用这张 B580，在容器里根本看不到，所以默认值给 12GB 的
                                 # 卡留了一半，而不是去猜另一个租户用了多少。只有当这张卡没有
                                 # 别人用时才值得调高。
    probe_dataset: true          # 每探测完一个镜头,往 <logs>/probe_dataset.jsonl 追加一行 JSON:
                                 # 镜头的几何信息、探到的 (crf, 分数) 点、显卡也探过时的
                                 # (q, 分数) 点、两个交点,以及这一集最终用什么 CRF 编的。
                                 # 为什么要留:把一个编码器的质量索引映射到另一个的 CRF,
                                 # 那条拟合线的残差不是"样本还不够"——163 镜头那一集实测,
                                 # 两参数直线在 104 对样本时就已经在渐近值的 0.5% 以内
                                 # (sqrt(1+1/n)),所以那 4.14 CRF 是这个**关系**本身,不是估计误差。
                                 # 能改善它的是更丰富的模型;而同一集里 94% 的镜头是被整个探测
                                 # 的(不是抽样),意味着那个残差是模型**可以学**的内容结构,
                                 # 而不是学不掉的测量噪声。
                                 # 更丰富的模型需要不止一集的 160 对样本,而每跑一集不记录就
                                 # 永久损失一集。一集 160 行完全不占地方,这是"以后想要这批数据"
                                 # 最便宜的保险。

    # ---- GPU 探测路径(可选，附加；probe_encoder=svt 时完全不生效) ----
    probe_encoder: svt           # 探测用哪个编码器。svt=上面描述的原有路径；qsv=在显卡上探测
                                 # (VA-API 解码直接进硬件 AV1 编码器)，再把找到的质量索引通过
                                 # 逐作业标定映射回 SVT 的 CRF。
                                 # 它可能不只是更快而是更准: 300 帧 4K 一次探测 16.4 CPU 秒，
                                 # 对 SVT preset 9 的 88.3 秒，省下的预算可以把探测窗口放开——
                                 # 而 probe_max_frames 的截断正是今天预测误差里最大的一项
                                 # (端到端 sd 1.19 中占 sd 1.22)，它存在的唯一原因就是 SVT 探测贵。
                                 # 10 个 4K 窗口实测,用同一 VMAF 处的 QSV 质量索引拟合 SVT CRF,
                                 # 留一残差: 目标 91 时 0.12 VMAF、目标 94 剔除一个离群点后 0.29,
                                 # 而 SVT 探测路径自身的 preset 误差是 0.76。
                                 # qsv+svt=同样的显卡工作换一种用法：映射出来的 CRF 只决定
                                 # "从哪里开始探"，最终交付的 CRF 仍然来自 SVT 探测、由
                                 # pick_crf 插值，和原有路径产出的是同一个东西。所以映射错了
                                 # 只会多花一次探测，而不会交付一个没人量过的 CRF——这也是它
                                 # 不需要 qsv 那个拒绝闸门的原因，以及它可以拿每个核验过的镜头
                                 # 继续修正那条线(而不是只靠固定的 anchors)的原因。
                                 # 按生产配置(probe_crfs 九点 + 4k 预设 probes:4 => 网格
                                 # [18,30,38,50])模拟 4000 个镜头: 原有二分 3.98 次探测/镜头、
                                 # 最终区间 9.62 CRF 宽、插值误差均值 0.34 CRF; 用实测的 sd 1.2
                                 # 预测播种后 2.10 次、区间 2.00 CRF、误差 0.01。即使映射差到
                                 # sd 4(远差于实测)仍是 2.12 次、误差 0.13。E08 实测 3.88 次/镜头，
                                 # 和模拟的 3.98 对得上。
                                 # 代价在显卡那边: 每镜头的 GPU 操作从 3.98 次涨到约 9 次
                                 # (2.1 次打分 + 3.5 次 QSV 编码 + 3.5 次 QSV 打分)，所以瓶颈
                                 # 可能从 CPU 挪到卡上，这一项必须实测。
                                 # 实测(2026-09-14，生产作业形态: 1080p 预设、目标 96-97、
                                 # probes 4、零拷贝打分开启、40 核；三段 4K 杜比视界片段共 912 个
                                 # 镜头，选完 CRF 即停): 探测阶段比 svt 快 23.4% / 23.4% / 32.7%，
                                 # 合计 26.9%；SVT 探测 3.83-3.91 次/镜头降到 2.34-2.59 次，另加
                                 # 2 次显卡探测；71-86% 的镜头被播种；CPU 占用从 36 核降到 30-32
                                 # 核，所以瓶颈没有挪到卡上。选出的 CRF 与 svt 相差不超过 1 的
                                 # 镜头占 96-100%，没有相差超过 2 的(超过 1 的是平滑从相邻镜头带
                                 # 过来的，或两边在不同区间插值)；整卡显存峰值高 1-2 GB。
                                 # 零拷贝上线前同样的设计只打平(+2.1%)，因为那时两条路共用的打分
                                 # 还吃 CPU，显卡探测和 SVT 探测抢的是同一批核。
    gpu_probe_qs: [14, 18, 22, 26, 30, 34, 38]   # QSV 侧扫描的质量索引,作用同 probe_crfs,
                                 # 搜索方式也是同一套二分。av1_qsv 在 4K 上约 50 以上就饱和了。
    gpu_probe_anchors: 16        # 同时用两条路探测、用来拟合映射的镜头数。它们是正常的探测——
                                 # 这些镜头用的就是自己的 SVT 结果，所以不是白跑的工作量。
    gpu_probe_max_residual: 2.0  # 标定的留一残差超过这么多 CRF 就整个作业放弃映射、退回 SVT。
                                 # 按实测 0.24 VMAF/CRF，默认值约合 0.5 VMAF。
    gpu_probe_max_q_margin: 1.5  # 逐镜头弃权: 质量索引超出锚点取值范围这么多的镜头,不信任外推的
                                 # 直线,改用 SVT 探测。这条规则就是用来兜住上面那个离群点的——
                                 # 一个很容易编的镜头让 SVT 在 CRF 36 才到目标,而主体在 20 附近,
                                 # 直线在它上面差了 10 个 CRF。
    gpu_probe_preset: 4          # QSV 编码器 preset(0-7,越小越慢越好)。映射就是在 4 上标定的。
    scenedetect_scale: "-2:540"  # 4K 分镜前先用 ffmpeg 降采样(帧号1:1)，避免 OpenCV 逐帧解 4K 卡死
    max_shots: 3000              # cap; shortest shots merged past this
    max_crf_delta: 4.0           # 相邻镜头 CRF 差上限(0=关闭)，避免质量跳变
    min_crf: 0                   # CRF 硬下限(0=用 probe_crfs 最小值)。目标不可达时每个镜头都会
    max_crf: 0                   # 交付 CRF 的硬上限(0 = probe_crfs 的顶端)，min_crf 的镜像。
                                 # 它存在是为了把**探测范围**和**交付范围**分开。163 镜头实测:
                                 # 17 个镜头在网格顶端仍然超标、10 个在底端仍然够不到——两批都
                                 # 要花光整个探测预算才发现这件事，最后还是被钳到网格端点。
                                 # 放宽 probe_crfs 能找到它们真正的交点(最简单的外推到 CRF 87)，
                                 # 但只有在"探到 63"不等于"发 63"的前提下放宽才安全。
                                 # 所以: probe_crfs 管**去哪看**, min_crf/max_crf 管**能发什么**。
                                 # 分开之后放宽探测范围不花钱——显卡只探自己网格的两端,而带预测
                                 # 的 SVT 搜索是围着预测值放两点,不扫网格。
                                 # 掉到网格最低 CRF，这正是文件反而变大的原因，设这个可以兜底
    probe_crf_offset: 0.0        # 加到插值出的 CRF 上，把探测的系统偏差换回体积。0=关闭。
                                 # 注意方向不是想当然的那个，而且不固定：10 个 4K 窗口在 CRF 24 上
                                 # 实测,同一窗口用 preset 4 比 preset 9 的 VMAF 低 0.80(sd 0.76)——
                                 # 慢档把额外的功夫花在码率上而不是这个指标上。但端到端的偏差符号
                                 # 随内容变: clip_A -0.18、DV P7 remux -0.29、8-bit 1080p WEB-DL
                                 # +1.52。所以这是该逐作业标定的偏差，不是能假定的常数。
                                 # 而且它只是问题的小的那一半:每镜头的离散(偏移量根本管不到)主要
                                 # 来自 probe_max_frames 对长镜头的截断。
    fractional_crf: false        # pass decimal CRF to SVT-AV1 (needs support)
    keep_probes: false           # keep per-shot probe files for debugging
    drop_empty_subtitles: true   # 丢掉源里"一条字幕都没有"的空字幕轨(默认开)。
                                 # 起因: Plex 在一集 4K HDR 输出上自动选中了一条空的 PGS 轨,
                                 # 而 PGS 是图形字幕、服务器没有对应的软字幕目标格式, 于是整个画面
                                 # 被重编码来烧字幕: 0.2-0.9 倍速、转码进程约 660% CPU
                                 # (16 个线程全耗在字幕叠加的 scale 上, 每帧一次), 而那条轨里
                                 # 什么都没有。成品库实测: 5344 个文件里 4349 个带字幕, 110 条
                                 # 图形字幕轨按自身 tag 就是空的; 我们自己发出去的 45 个输出里,
                                 # 42 个的字幕轨全是空的。
                                 # 判定只读文件头: mkv 看 NUMBER_OF_FRAMES 统计 tag(含 -eng 这种
                                 # 带语言后缀的副本), 没有 tag 再用 mkvmerge -J 的
                                 # num_index_entries(实测每个文件 0.198-2.3 秒; 但 v74 压根不报这个
                                 # 属性, 遇到就整份保留并打一条日志); mp4 看轨道自己的时长
                                 # duration_ts —— nb_frames 用不了: ffprobe 只在非零时才打印它,
                                 # 而且 mov 会给没有字幕的轨补一个 padding sample, 实测空轨读出来
                                 # 是 "1"; 空轨 duration_ts=0, 单条字幕的轨是 500000, 真实的
                                 # ATVP mov_text 轨是 27 亿。
                                 # 任何一步读不到、读不懂、两个工具对不上, 一律保留 —— 丢错一条
                                 # 等于毁掉那份字幕的唯一副本(开了 delete_source 源文件已经没了),
                                 # 留错一条只是菜单里多一项。false = 和以前一样全部复制。
    ass_srt_companion: true      # 每条保留下来的 ASS/SSA 字幕旁边再挂一条纯文本 srt(默认开)。
                                 # ASS 轨本身原样保留、绝不转换: 这是"附加"而不是"替换"。
                                 # 它搭在本来就要跑的那一次 demux 上(同一条 ffmpeg 命令多一个输出),
                                 # 每条约 35KB, 给那些不渲染 ASS、只会烧字幕的播放器一个软字幕选择。
                                 # 它不能反过来当替代品: ffmpeg 的 srt 编码器会往文本里写 <font>
                                 # 标签和字面的 {\anN}(这两样会被清掉), 而 \pos/\move 是它自己
                                 # 直接丢弃的, 所以特效/排版字幕转出来一定是坏的 —— ASS 就是为
                                 # 这个留着的。
    pgs_ocr_srt: true            # 把源里每条"英文图形字幕"(PGS)OCR 成一条纯文本 srt 挂在旁边
                                 # (默认开)。图形轨本身原样保留、绝不删除。
                                 # 这是 drop_empty_subtitles 那个毛病的另一半: Plex 对图形字幕
                                 # 没有软字幕目标格式, 一旦选中就只能烧进画面、整集重编码
                                 # (0.2-0.9 倍速, 转码进程约 660% CPU)。丢掉空轨只是让它不再
                                 # 选中"里面什么都没有"的轨; 这一条是给那些真有内容的轨
                                 # 准备一份它能直接发出去的文本。生成的 srt 会接过 default
                                 # 标记, 原图形轨改写成非 default —— 否则 Plex 照样自动选图形轨,
                                 # 等于白做。
                                 # 只做英文, 而且这是能力上限不是偏好: 镜像里只装了 eng 一个
                                 # tesseract 模型。成品库实测 5005 条图形字幕轨里只有 1034 条
                                 # 是英文, 其余是中日韩泰阿拉伯文; eng 模型遇到这些不会报错,
                                 # 而是吐出一堆看着像模像样的乱码, 然后被当成字幕写进成品。
                                 # 所以非英文图形轨完全不碰。
                                 # 同理只做 PGS: 那 1034 条英文图形轨里 929 条是 PGS、
                                 # 105 条是 DVD VobSub —— 后者是另一种容器和位图排布,
                                 # 这个解析器读不了, 于是和中文轨一样原样不动。
                                 # 库里英文轨的语言 tag 一律写作 eng, 但匹配仍然兼容
                                 # en / english 这些写法。
                                 # 准确度实测(用文件自带的 SDH 文本轨当基准,
                                 # Agents of S.H.I.E.L.D. S05E05, 711 条):
                                 # 忽略大小写的字符错误率 0.1276%, 689/711 条完全一致;
                                 # 在真实库里跑的 71 个文件中 70 个通过结构门限。
                                 # 开销: .sup 的提取是挂在本来就要跑的那次 demux 上多一个输出,
                                 # 不额外读一遍源; OCR 本身的并发有上限(见 pgsocr.default_workers)。
                                 # 它永远不会让编码失败: 没装 tesseract、轨道解析不了、某条卡住、
                                 # 门限没过 —— 一律降级成"这条轨没有 srt"并打一条告警。

  hdr:
    preserve: true             # keep mastering display / CLL on output
    default_master_display: "G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1)"
    default_max_cll: "1000,400"

  metadata:
    strip_ads: true            # 清掉压制组/网站在输出元数据里打的广告: 标题、全局 tags、
                               # 轨道名、附件(字体永远不删)。标题是发布名(无空格、带 2160p/
                               # WEB-DL/x265 这类词)也删, 那本来就不是 AV1 输出该有的信息。
                               # 全局 tags 里 COMMENT/COPYRIGHT/UPLOADER/GROUP/MUXER/ENCODER
                               # 按名字删 —— 库里扫到的这些字段全是签名或封装器戳。
                               # IMDB/TMDB/TVDB、季/集编号、简介、章节都不动。
    ad_tokens:                 # 除网址外算作广告的词: 整词匹配、不分大小写, 空格也匹配点和
                               # 横杠("Ben The Men" 同时匹配 "BEN.THE.MEN")。默认值是
                               # 2026-09-21 在库里(每部剧抽 2 个源)实际扫到的组名和站名。
      - BTM
      - Ben The Men
      - RARBG
      - PSA
      - PSArips
      - SWTYBLZ
      - JAKET789
      - HSaber
      - Z@X
      - HHWEB
      - 3MWEB
      - ZmWeb
      - ZmPT
      - AilMWeb
      - bdys
      - 哔嘀影视
      - Rainbow Island

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  api_key: ""                  # optional; clients must send X-API-Key

logging:
  level: INFO
  file: true
  retention_days: 7          # job_*.log 保留天数，超出自动清理(0=不清理)

tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  mediainfo: mediainfo
  av1an: av1an
  dovi_tool: dovi_tool
  mkvmerge: mkvmerge
  mkvextract: mkvextract
  mkvpropedit: mkvpropedit
