<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AV1 Transcode Archive</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/base.css">
  <style>
    /* The clock is the first thing a 390px bar can spare; the counts are not.
       While disconnected the retry countdown stays, because it is the one
       thing the operator is waiting for. */
    @media (max-width: 560px){
      .bar__pulse:not([data-state="down"]) .pulse__at{ display: none; }
    }

    /* ---- transport block: one per running / analyzing job */
    .now + .now{ margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--rule); }
    .now__name{ margin: 0 0 var(--s2); font-size: var(--t-body); font-weight: 500; overflow-wrap: anywhere; }
    .now__top{ display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s3); }
    .now__stage{ margin: 0; display: flex; flex-direction: column; line-height: var(--lh-data); }
    .now__stage span{ color: var(--dim); font-size: var(--t-meta); }
    .now__stage b{ font-size: var(--t-lead); }
    .now .ladder{ margin-bottom: var(--s3); }
    /* One line for the live readout instead of a tower of wrapped digits in a
       10%-wide segment: only the live segment carries text, so running into
       its neighbours overlaps nothing. The last segment grows leftwards. */
    @media (min-width: 560.02px){
      .now .ladder__read{ white-space: nowrap; }
      .now .ladder__seg:last-child .ladder__read{ justify-self: end; }
    }
    .now__line{ margin: 0; font-size: var(--t-meta); color: var(--dim); line-height: var(--lh-data); overflow-wrap: anywhere; }
    .now__facts{ margin: var(--s2) 0 0; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: var(--t-meta); color: var(--dim); line-height: var(--lh-data); }
    .now__facts b{ font-weight: 400; color: var(--type); }
    .now__facts .mono{ overflow-wrap: anywhere; }
    .now .row__err{ margin-top: var(--s2); }
    .now__detail{ margin-top: var(--s4); padding: var(--s4); background: var(--sheet-2); }
    .now__none{ margin: 0; color: var(--dim); }

    /* ---- queue toolbar */
    .qtools{ display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s4); }
    .qtools__end{ display: flex; flex-wrap: wrap; gap: var(--s2); margin-left: auto; }
    @media (max-width: 560px){
      .qtools > .btn--solid{ flex: 1 0 100%; }
      .qtools__end{ flex: 1 0 100%; margin-left: 0; }
      .qtools__end > .btn{ flex: 1 1 0; }
    }

    /* ---- table columns (>= 900px) */
    #jobsTable th.num, #jobsTable td.row__num{ text-align: right; }
    #jobsTable .c-mark{ width: 88px; }
    #jobsTable .c-prog{ width: 19%; }
    #jobsTable .c-preset{ width: 17%; }
    #jobsTable .c-size{ width: 150px; }
    #jobsTable .c-time{ width: 76px; }
    #jobsTable .row__prog{ width: auto; }
    /* A landscape tablet is past 900px and gets the table, not the cards,
       and a one-line file name there is a 22px target. */
    @media (pointer: coarse){ #jobsTable .row__toggle{ min-height: var(--touch); } }
    .prog{ margin: 0; line-height: var(--lh-data); font-size: var(--t-meta); color: var(--dim); }
    .prog b{ font-weight: 500; color: var(--type); }
    .row__prog .ladder{ margin-top: var(--s2); }
    .preset{ font-size: var(--t-meta); line-height: var(--lh-data); overflow-wrap: anywhere; }
    .preset .mono{ display: block; margin-top: var(--s1); color: var(--dim); }
    .ratio{ display: block; margin-top: var(--s1); }
    .ratio[data-dir="down"]{ color: var(--ok); }
    .ratio[data-dir="up"]{ color: var(--signal); }
    .card{ margin: 0; font-size: var(--t-meta); color: var(--dim); line-height: var(--lh-data); }
    .rows .row__num .ratio{ display: inline; margin: 0; }

    /* ---- expanded detail: identity + config | media + timeline */
    .detail{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 var(--s5); }
    @media (min-width: 1100px){
      .detail{ grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    }
    .detail__full{ grid-column: 1 / -1; }
    .detail .kv dd .btn{ vertical-align: middle; }
    .aux{ color: var(--dim); margin-left: var(--s2); white-space: nowrap; }
    .errtext{
      margin: 0; max-height: 40vh; overflow: auto;
      white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--ink); color: var(--type);
    }
    .row__detail .btnrow{ margin-top: var(--s3); }

    .tally{ margin: 0; color: var(--dim); font-size: var(--t-meta); }
    .more{ display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-top: var(--s4); }
    .more .btn{ margin-left: auto; }
    @media (max-width: 560px){ .more .btn{ flex: 1 0 100%; margin-left: 0; } }

    /* ---- dialogs. .field splits into gauge | manual at >=1100px, which is
       right for the settings page and cramped inside a 720px sheet. */
    .dlg .field{ display: block; padding-left: 0; border-left: 0; }
    .dlg .field + .field, .dlg .field + .pair, .dlg .hint + .field{ margin-top: var(--s5); }
    .dlgform{ display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .pair{ display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); margin-top: var(--s5); }
    @media (min-width: 561px){ .pair{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .pair .field + .field{ margin-top: 0; }
    .echo{ margin: var(--s2) 0 0; font-size: var(--t-meta); color: var(--dim); overflow-wrap: anywhere; line-height: var(--lh-data); }
    .hint{ margin: var(--s2) 0 0; font-size: var(--t-body); color: var(--dim); line-height: var(--lh-prose); }
    .warn{ color: var(--signal); }
    .dirs{ display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); color: var(--dim); font-size: var(--t-meta); }
    .keys{ list-style: none; margin: var(--s2) 0 0; padding: 0; font-size: var(--t-meta); line-height: var(--lh-data); }
    .keys li{ margin: 0; padding: var(--s1) 0; border-top: 1px solid var(--rule); }
    .keys span{ color: var(--dim); margin-left: var(--s2); }
    #path, #bPath, #custom{ font-family: var(--mono); }

    .bnav{ display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule); }
    .bnav input{ flex: 1 1 280px; }
    @media (max-width: 560px){ .bnav{ padding-left: var(--s3); padding-right: var(--s3); } .bnav .btn{ flex: 1 0 100%; } }
    .bstate:empty{ display: none; }
    .bstate{ margin-bottom: var(--s3); }
    .btree{ list-style: none; margin: 0; padding: 0; transition: opacity .18s ease-out; }
    .btree.is-loading{ opacity: .5; }
    .btree li{ margin: 0; }
    .brow{
      appearance: none; -webkit-appearance: none;
      display: flex; align-items: center; gap: var(--s3);
      width: 100%; min-height: var(--touch-main); padding: var(--s2) var(--s2);
      background: none; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
      color: var(--type); font: inherit; font-size: var(--t-body); text-align: left; cursor: pointer;
    }
    @media (hover: hover){ .brow:hover{ background: var(--sheet); } }
    .brow__ico{ flex: none; width: 1em; color: var(--dim); text-align: center; }
    .brow__name{ flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: var(--lh-data); }
    .brow__sz{ flex: none; color: var(--dim); font-size: var(--t-meta); }
  </style>
</head>
<body>
<header class="bar">
  <a class="bar__title" href="/"><span class="bar__full">AV1 Transcode Archive</span><span class="bar__short">队列</span></a>
  <p class="bar__pulse" id="pulse" data-state="idle"><span id="pulseMain">正在连接…</span><span class="pulse__at" id="pulseAt"></span></p>
  <nav class="bar__nav">
    <a href="/" aria-current="page">队列</a>
    <a href="/static/settings.html">设置</a>
    <a href="/static/docs.html">说明</a>
  </nav>
</header>

<main id="main">
  <section class="sheet" id="now" aria-labelledby="nowHead">
    <h2 class="head" id="nowHead">正在转码 <small class="head__note" id="nowCount"></small></h2>
    <div id="nowList">
      <div class="skel skel--mid"></div><div class="skel skel--wide"></div><div class="skel skel--short"></div>
    </div>
    <p class="now__none" id="nowEmpty" hidden>没有作业在跑。</p>
  </section>

  <section class="sheet" id="queue" aria-label="任务列表">
    <div class="qtools">
      <button type="button" class="btn btn--solid" data-open="submit">＋ 提交转码</button>
      <div class="qtools__end">
        <button type="button" class="btn btn--quiet" id="cancelAllBtn">取消全部排队</button>
        <button type="button" class="btn btn--quiet" id="pruneBtn" title="删除所有已结束（完成/失败/取消/跳过）的记录">清除历史记录</button>
      </div>
    </div>

    <div class="chiprow" id="chips" role="group" aria-label="按状态筛选"></div>

    <div id="jobsSkel"><div class="skel skel--wide"></div><div class="skel skel--wide"></div><div class="skel skel--mid"></div></div>
    <div class="tablewrap" id="tableWrap" hidden>
      <table id="jobsTable">
        <thead><tr>
          <th scope="col" class="c-mark">状态</th>
          <th scope="col">文件</th>
          <th scope="col" class="c-prog">阶段与进度</th>
          <th scope="col" class="c-preset">预设</th>
          <th scope="col" class="c-size num">源 → 成品</th>
          <th scope="col" class="c-time num">用时</th>
        </tr></thead>
      </table>
    </div>
    <ul class="rows" id="jobsList"></ul>
    <div class="empty" id="jobsEmpty" hidden></div>

    <div class="more">
      <p class="tally" id="tally"></p>
      <button type="button" class="btn" id="moreBtn" hidden>载入更多</button>
    </div>
  </section>
</main>

<dialog class="dlg dlg--sheet" id="submitDlg" aria-labelledby="submitTitle">
  <div class="dlg__head">
    <h2 id="submitTitle">提交转码</h2>
    <button type="button" class="btn btn--quiet" data-close aria-label="关闭">✕</button>
  </div>
  <form class="dlgform" id="submitForm" novalidate>
    <div class="dlg__body">
      <div class="field">
        <label class="field__label" for="path">文件或目录</label>
        <div class="field__ctl"><input type="text" id="path" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="绝对路径：/media/input/xxx.mkv 或目录"></div>
        <p class="field__help">填容器里看得到的绝对路径。目录会把里面每个可识别的文件各排一个任务。</p>
        <div class="field__foot">
          <button type="button" class="btn btn--sm" id="browseBtn">浏览…</button>
          <span class="dirs" id="dirs"></span>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="preset">预设</label>
        <div class="field__ctl"><select id="preset"></select></div>
        <p class="echo mono" id="presetEcho" hidden></p>
      </div>

      <div class="pair" id="customCtl" hidden>
        <div class="field">
          <label class="field__label" for="engine">编码引擎</label>
          <div class="field__ctl"><select id="engine"></select></div>
        </div>
        <div class="field">
          <label class="field__label" for="target_metric">探测指标</label>
          <div class="field__ctl"><select id="target_metric"></select></div>
          <p class="field__help">只对 optimizer 引擎生效。</p>
        </div>
      </div>
      <p class="hint" id="customHint"></p>

      <div class="field">
        <label class="field__label" for="custom">自定义参数</label>
        <div class="field__ctl"><input type="text" id="custom" list="paramKeys" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="crf=24,preset=3,target_quality=75-85"></div>
        <p class="field__help">逗号或分号分隔的 key=value，值里可以带 =。会覆盖所选预设的对应字段。</p>
        <p class="field__help warn" id="paramWarn" hidden></p>
        <details class="disclose field__note"><summary id="keysSummary">可用字段</summary><ul class="keys" id="keysList"></ul></details>
        <datalist id="paramKeys"></datalist>
      </div>
    </div>
    <div class="dlg__foot">
      <p class="formstate" id="submitState" role="status" aria-live="polite"></p>
      <button type="submit" class="btn btn--solid" id="submitBtn">提交转码</button>
    </div>
  </form>
</dialog>

<dialog class="dlg dlg--sheet" id="browseDlg" aria-labelledby="browseTitle">
  <div class="dlg__head">
    <h2 id="browseTitle">目录浏览</h2>
    <button type="button" class="btn btn--quiet" data-close aria-label="关闭">✕</button>
  </div>
  <form class="bnav" id="browseNav">
    <input type="text" id="bPath" aria-label="当前目录（可编辑，回车跳转）" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="btn" id="bUp">↑ 上一级</button>
  </form>
  <div class="dlg__body">
    <p class="formstate bstate" id="bState" role="status" aria-live="polite"></p>
    <ul class="btree" id="btree"></ul>
  </div>
  <div class="dlg__foot">
    <button type="button" class="btn" data-close>关闭</button>
    <button type="button" class="btn btn--solid" id="bUse">选择当前目录</button>
  </div>
</dialog>

<div class="notice-host" id="notices"></div>

<script src="/static/apikey.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/fields.js"></script>
<script src="/static/queue.js"></script>
</body>
</html>
