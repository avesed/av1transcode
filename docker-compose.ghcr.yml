services:
  av1transcode:
    image: ghcr.io/avesed/av1transcode:latest
    container_name: av1transcode
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Mount your media library here. Adjust to your real paths.
    # 配置已内置在镜像内（/app/config.yaml）；如需自定义，取消下一行注释并放置自己的 config.yaml
    # - ./config.yaml:/app/config.yaml:ro
    volumes:
      - ./media/input:/media/input
      - ./media/work:/media/work
      - ./sample:/media/sample
      - av1data:/data
    environment:
      # Everything below can also be set in config.yaml
      - AV1TC_WORKERS_CONCURRENCY=1
      - AV1TC_WORKERS_AV1AN_WORKERS=${AV1AN_WORKERS:-0}
      # P5 -> HDR10 via libplacebo needs a Vulkan device.
      # Without a GPU, use Mesa's llvmpipe software renderer (slow but works):
      # On a host with NO usable GPU, uncomment these to pin the Vulkan loader
      # to the software renderer. With a GPU passed through (see `devices`
      # below) they must stay OFF: they hide every real device, which is how
      # the Dolby Vision libplacebo pass ended up running on llvmpipe and
      # burning 23.5 cores where the GPU does it in 4.9.
      # - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      # - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - TZ=Asia/Shanghai
    # A GPU is used for two things: libplacebo applying a Dolby Vision RPU
    # (Vulkan), and hardware decode of the source (VA-API / QSV). SVT-AV1 and
    # libvmaf remain CPU-only.
    #
    # ONE render node, not all of /dev/dri: passing the whole directory hands
    # over every card in the box, which on a mixed host means the NVIDIA ones
    # too. Find the node for the card you want with
    #   ls -l /dev/dri/by-path/    # pci-<domain:bus:dev.fn>-render -> renderDN
    # and put the renderD1NN it points at below. The by-path name itself cannot
    # go here - it contains colons, which is also this field's separator.
    #
    # `group_add` must name the GID that owns the node on the HOST (`getent
    # group render`), not the name - the name may not resolve inside the image.
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
    group_add:
      - "993"   # host `render` group
    # /dev/shm holds the optimizer's per-shot Dolby Vision P5 shards
    # (a lossless 4K shot is ~200MB and several are in flight at once),
    # which keeps the DV path off disk entirely.
    shm_size: "4gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  av1data:
