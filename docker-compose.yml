services:
  av1transcode:
    build:
      context: .
      dockerfile: Dockerfile
    image: av1transcode:latest
    container_name: av1transcode
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Mount your media library here. Adjust to your real paths.
    # 配置已内置在镜像内（/app/config.yaml）；如需自定义，取消下一行注释并放置自己的 config.yaml
    # - ./config.yaml:/app/config.yaml:ro
    volumes:
      - ./media/input:/media/input
      - ./media/work:/media/work
      - ./sample:/media/sample
      - av1data:/data
    environment:
      # Everything below can also be set in config.yaml
      - AV1TC_WORKERS_CONCURRENCY=1
      - AV1TC_WORKERS_AV1AN_WORKERS=${AV1AN_WORKERS:-0}
      # P5 -> HDR10 via libplacebo needs a Vulkan device.
      # Without a GPU, use Mesa's llvmpipe software renderer (slow but works):
      - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - TZ=Asia/Shanghai
    # Pass a real GPU through for hardware-accelerated libplacebo (the DV
    # Profile 5 conversion is the only thing here that uses one; SVT-AV1 and
    # libvmaf are CPU-only). The image ships Mesa's Intel and AMD Vulkan ICDs;
    # NVIDIA additionally needs the NVIDIA Container Toolkit.
    # NB: on a host WITH a GPU, drop the two MESA_/VK_ICD_FILENAMES lines above
    # - they pin the loader to the software renderer and hide every real device.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    # /dev/shm holds the optimizer's per-shot Dolby Vision P5 shards
    # (a lossless 4K shot is ~200MB and several are in flight at once),
    # which keeps the DV path off disk entirely.
    shm_size: "4gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  av1data: